name: CI

on:
  pull_request:
  push:
    branches: [main]

# Отменять устаревшие запуски для той же ветки/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  dockerfile-lint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing

  build-scan:
    name: Build & Trivy scan
    runs-on: ubuntu-latest
    needs: [lint, dockerfile-lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build image (без публикации)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: cicd-template-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (падает при CRITICAL/HIGH с доступным исправлением)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cicd-template-app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test (контейнер стартует и отвечает на /health)
        run: |
          docker run -d --name smoke -p 8000:8000 cicd-template-app:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo; echo "OK"; exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1
